site_name: Pegg Documentation
site_url: https://docs.pegg.dev/
site_description: Pegg - Coding Agent Documentation

repo_name: peggco/pegg
repo_url: https://github.com/peggco/pegg
edit_uri: https://github.com/peggco/pegg/edit/master/docs/

copyright: "&copy; 2026 Pegg"

theme:
  name: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.footnote.tooltips
    - content.tabs.link
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: lucide/sun-moon
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: lucide/moon-star
        name: Switch to system preference
  icon:
    tag:
      default: lucide/hash

plugins:
  - search
  - tags
  - markdown-exec

extra:
  homepage: https://pegg.dev
  scope: /
  annotate:
    json: [.s2]
  status:
    new: Recently added
    deprecated: Deprecated
    material: Material for MkDocs
  social:
  tags:
    default: default

extra_css:
  - style.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - zensical.extensions.glightbox:
      auto_themed: true
  - zensical.extensions.preview:
      targets:
        include:
          - customization.md
          - compatibility/markdown/*
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: zensical
      repo: zensical
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: https://pegg.dev
  - Pegg:
      - Overview: pegg/overview.md
      - Installation: pegg/installation.md
      - Providers & Models: pegg/providers-and-models.md
      - Config: pegg/config.md
      - Troubleshooting: pegg/troubleshooting.md
      - Usage:
        - CLI: pegg/usage/cli.md
        - TUI: pegg/usage/tui.md
        - HTTP: pegg/usage/http.md
        - ACP: pegg/usage/acp.md
      - Configurations:
        - Tools: pegg/configurations/tools.md
        - Skills: pegg/configurations/skills.md
        - Rules: pegg/configurations/rules.md
        - MCP: pegg/configurations/mcp.md
        - LSP: pegg/configurations/lsp.md
        - Plugins: pegg/configurations/plugins.md
      - Features:
        - Subagents: pegg/features/subagents.md
        - Commands: pegg/features/commands.md
        - Adding Context: pegg/features/adding-context.md
        - Sessions: pegg/features/sessions.md
        - Permissions: pegg/features/permissions.md
        - Notifications: pegg/features/notifications.md
        - Connect: pegg/features/connect.md
  - Sdk:
      - Get Started: sdk/index.md
      - Chat: sdk/chat.md
      - Sessions: sdk/sessions.md
      - Files: sdk/files.md
      - Extending: sdk/extending.md
      - Events & Errors: sdk/events-errors.md
  - Peggbot:
      - Overview: peggbot/index.md
      - Configuration: peggbot/configuration.md
      - Workflows: peggbot/workflows.md
      - Prompts: peggbot/prompts.md
      - GitHub Tools: peggbot/github-tools.md
  - Plugin:
      - Overview: plugin/index.md
      - Quickstart: plugin/quickstart.md
      - Interface: plugin/interface.md
      - Development Guide: plugin/development.md